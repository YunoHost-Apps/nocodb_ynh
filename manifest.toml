#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "nocodb"
name = "NocoDB"
description.en = "No-code platform that turns any database into a smart spreadsheet"
description.fr = "Plateform sans code qui transforme toute base de données en un tableur intelligent"

version = "2026.06.1~ynh1"

maintainers = ["tituspijean"]

[upstream]
license = "AGPL-3.0-only"
website = "https://www.nocodb.com"
demo = "https://www.nocodb.com/demos"
code = "https://github.com/nocodb/nocodb"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false

ldap = false
sso = false

disk = "50M"
ram.build = "450M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    help.en = "The app has its own user login system, so you can disable YunoHost's SSO, especially if you use NocoDB's API."
    help.fr = "L'application a son propre système d'authentification, vous pouvez donc désactiver le SSO de YunoHost, particulièrement si vous utilisez l'API de NocoDB."
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/nocodb/nocodb/releases/download/2026.06.1/Noco-linux-x64"
    amd64.sha256 = "51e481c9bf84fd71d23740e321caa6d327fa54da3a570a02a733bfff4c1aa3c5"
    arm64.url = "https://github.com/nocodb/nocodb/releases/download/2026.06.1/Noco-linux-arm64"
    arm64.sha256 = "0bc6c238efbf1c0b0c55af1b5dcbbb1cc749ab1ecbff95f69bc46c18cd476090"
    rename = "nocodb"
    extract = false

    # Upstream does not release prebuilt binairies anymore. Auto-updater is temporarily disabled while we integrate the build in the install and upgrade scripts.
    #autoupdate.strategy = "latest_github_release"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = [
        "postgresql",
        "redis-server"
    ]

    [resources.database]
    type = "postgresql"
